[workspace]
members = [
    "crates/ark-cli",
    "crates/ark-core",
    "crates/ark-ingest",
    "crates/ark-neo4j",
    "crates/ark-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.81"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
mime_guess = "2.0"
rust-embed = "8.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
